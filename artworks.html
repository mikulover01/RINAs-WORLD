<script>
  // ==================================================
// CLICK CENTER ARTWORK TO VIEW FULL IMAGE
// ==================================================
document.addEventListener('DOMContentLoaded', () => {
  const lightbox = document.getElementById('art-lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const closeBtn = document.getElementById('lightbox-close');

  if (!lightbox) return;

  // Open full image when the centered card's image is clicked
  document.addEventListener('click', (e) => {
    const clickedImg = e.target.closest('.card-center img');
    if (clickedImg) {
      lightboxImg.src = clickedImg.src;
      lightboxCaption.textContent = clickedImg.alt || 'Artwork';
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
    }
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden', 'true');
    lightboxImg.src = '';
  }

  // Close when clicking X, tapping outside the window, or pressing Escape
  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      closeLightbox();
    }
  });
});

document.addEventListener('DOMContentLoaded', () => {
  const carousels = document.querySelectorAll('.carousel-container');

  carousels.forEach((carousel) => {
    const prevBtn = carousel.querySelector('.prev-btn');
    const nextBtn = carousel.querySelector('.next-btn');
    const cards = Array.from(carousel.querySelectorAll('.card'));
    const total = cards.length;

    // Start with the second card (index 1) in the center, or 0 if preferred
    let activeIndex = total > 1 ? 1 : 0;

    function updateCarousel() {
      // Calculate circular indices for left and right neighbors
      const prevIndex = (activeIndex - 1 + total) % total;
      const nextIndex = (activeIndex + 1) % total;

      cards.forEach((card, index) => {
        // Strip existing position classes
        card.classList.remove('card-left', 'card-center', 'card-right');

        if (index === activeIndex) {
          card.classList.add('card-center');
        } else if (index === prevIndex) {
          card.classList.add('card-left');
        } else if (index === nextIndex) {
          card.classList.add('card-right');
        }
        // All other cards automatically stay in their default hidden state
      });
    }

    function rotateNext() {
      activeIndex = (activeIndex + 1) % total;
      updateCarousel();
    }

    function rotatePrev() {
      activeIndex = (activeIndex - 1 + total) % total;
      updateCarousel();
    }

    // Initialize positions on page load
    updateCarousel();

    // Button Event Listeners
    nextBtn.addEventListener('click', rotateNext);
    prevBtn.addEventListener('click', rotatePrev);

    // Optional: Clicking a side card brings it to the center
    cards.forEach((card, index) => {
      card.addEventListener('click', () => {
        if (card.classList.contains('card-left')) rotatePrev();
        if (card.classList.contains('card-right')) rotateNext();
      });
    });

    // Mobile Touch / Swipe Support
    let touchStartX = 0;
    let touchEndX = 0;

    carousel.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    carousel.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const swipeDistance = touchStartX - touchEndX;
      
      if (swipeDistance > 35) rotateNext();
      else if (swipeDistance < -35) rotatePrev();
    }, { passive: true });
  });
});
